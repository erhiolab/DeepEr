name: 💡 功能建议 / Feature Request
description: 为这个项目提出一个新的想法或功能请求 / Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议! 一个好的功能请求应该清晰地描述使用场景. 
        
        Thanks for your suggestion! A good feature request should clearly describe the use case.

  - type: textarea
    id: problem
    attributes:
      label: 你的痛点 / 使用场景 / Your Problem / Use Case
      description: 这个功能是为了解决什么问题? 或者在什么场景下你需要这个功能?  / What problem does this feature solve? Or in what scenario do you need this feature?
      placeholder: |
        当我在做 [某件事] 时, 我总是遇到 [某个困难]...
        When I'm doing [something], I always encounter [a difficulty]...
      description: |
        清晰简洁地描述问题 / Describe the problem clearly and concisely
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案 / Proposed Solution
      description: 你希望这个功能具体长什么样? 或者如何工作?  / What do you want this feature to look like? Or how should it work?
      placeholder: |
        我希望能够..., 这样我就可以...
        I would like to be able to..., so that I can...
      description: |
        清晰简洁地描述你希望发生的情况 / Describe clearly what you want to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 如果没有这个功能, 你目前是如何解决这个问题的? (或者有没有其他竞品实现了类似功能? ) / How do you currently solve this problem without this feature? (Or have other similar products implemented this?)
      placeholder: |
        目前我通过...方式解决, 但是...
        Currently I solve it by..., but...
      description: |
        描述你考虑过的替代方案 / Describe alternative solutions you've considered

  - type: dropdown
    id: priority
    attributes:
      label: 优先级 / Priority
      description: 你认为这个功能的重要程度?  / How important do you think this feature is?
      options:
        - 🟢 低优先级 - 锦上添花 / Low - Nice to have
        - 🟡 中优先级 - 比较重要 / Medium - Quite important
        - 🔴 高优先级 - 不可或缺 / High - Must have
        - ⚫ 紧急 - 阻塞工作流 / Critical - Blocks workflow
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 额外上下文 / Additional Context
      description: 关于这个想法的截图/草图/或者参考链接 / Screenshots, sketches, or reference links about this idea
      placeholder: |
        添加任何其他上下文或屏幕截图 / Add any other context or screenshots
        参考链接 / Reference links:

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项 / Acknowledgements
      options:
        - label: 我确认这个功能符合项目的整体愿景和目标 / I confirm this feature aligns with the project's overall vision and goals
          required: true
        - label: 我已经搜索过现有的功能请求, 确认没有重复 / I have searched existing feature requests and confirmed this is not a duplicate
          required: true
        - label: 我愿意参与这个功能的开发或测试(可选)/ I am willing to participate in developing or testing this feature (optional)
          required: false
