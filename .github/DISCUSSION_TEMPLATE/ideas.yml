name: 💡 Ideas / 想法与建议
description: Share your ideas to improve the project / 分享你的想法以改进项目
title: "[Idea]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        我们非常期待听到你的新想法! 请描述你的建议以及它能为项目带来什么价值.
        We are excited to hear your new ideas! Please describe your suggestion and the value it brings to the project.

  - type: textarea
    id: motivation
    attributes:
      label: 动机与场景 / Motivation & Use Case
      description: 为什么需要这个功能? 在什么场景下会用到?  / Why is this needed? In what scenario would it be used?
      placeholder: |
        当我在做 [某事] 时, 我发现 [某个痛点]...
        When I was doing [something], I found [a pain point]...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议 / Your Proposal
      description: 你期望这个功能具体怎么实现?  / How do you expect this feature to work specifically?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 有没有其他考虑过的方案? / Are there any alternative solutions you've considered?

  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议 / Suggested Priority
      description: 你认为这个想法有多重要?  / How important do you think this idea is?
      options:
        - 🟢 锦上添花 / Nice to have
        - 🟡 比较重要 / Quite important
        - 🔴 不可或缺 / Must have
    validations:
      required: true
