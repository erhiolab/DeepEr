[package]
name = "deeper"
version = "0.2.1"
description = "DeepEr"
authors = ["erhio", "qicajie"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "process", "sync", "io-util"] }
sse-stream = "0.2"
# MCP HTTP 传输使用 rmcp 配套的 reqwest 0.13 (与项目其它模块的 0.12 互不影响)
reqwest_mcp = { package = "reqwest", version = "0.13", features = ["json", "stream"] }
# 加密: API Key 等敏感配置以 AES-256-GCM 加密后入库
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# 压缩算法精简, 仅启用 deflate(纯 Rust miniz_oxide 后端), 避免编译依赖 cmake 的 zlib-ng/zstd 等 C 依赖
zip = { version = "1", default-features = false, features = ["deflate"] }
# MCP (Model Context Protocol) 客户端: 连接外部 MCP 服务器并调用其工具
rmcp = { version = "0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

[target.'cfg(windows)'.dependencies]
# 访问 WebView2 的 ICoreWebView2Controller (用于打开任务管理器)
webview2-com = "0.38"
# Win32 API: windows::core::Interface (cast) 与低级键盘钩子 (WH_KEYBOARD_LL 拦截 Shift+Esc)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
